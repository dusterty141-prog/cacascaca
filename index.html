<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запуск звука</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #playButton {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: none;
            background: #ff0000;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255,0,0,.8);
            transition: .15s;
        }

        #playButton:hover {
            transform: scale(1.05);
        }

        #playButton:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<button id="playButton">▶</button>

<audio id="player">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const button = document.getElementById("playButton");
const player = document.getElementById("player");

button.addEventListener("click", async () => {
    try {
        await player.play();
        button.style.display = "none";
    } catch (e) {
        alert("Не удалось воспроизвести звук.");
        console.error(e);
    }
});
</script>

</body>
</html>
